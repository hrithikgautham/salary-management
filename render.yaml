services:
  - type: web
    name: acme-salary-management-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SUPABASE_ISSUER_URI
        value: https://vzzhlhkmaabmmjvhwgeh.supabase.co/auth/v1
      - key: SUPABASE_JWK_SET_URI
        value: https://vzzhlhkmaabmmjvhwgeh.supabase.co/auth/v1/.well-known/jwks.json
      - key: SUPABASE_ALLOWED_HR_EMAILS
        sync: false
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
